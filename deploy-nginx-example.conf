# sheets2kdocs Nginx 反代示例
# 宝塔用户也可以直接在面板里建站 + 反向代理到 127.0.0.1:8300
#
# 用法：配好 DNS 后，把 server_name 改成你的域名，复制到 /www/server/panel/vhost/nginx/ 下，
# 然后 nginx -t && nginx -s reload
# 同时把 /opt/sheets2kdocs/.env 的 BASE_URL 改为 https://域名，
# 并在 Kdocs 开放平台把回调地址改为 https://域名/auth/kdocs/callback

server {
    listen 80;
    server_name sync.toomotoo.com;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
